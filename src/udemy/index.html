<p>Thank you for filling out this course evaluation. Your feedback is essential for us to make improvements to the course.</p>
<p>All feedback is treated confidentially, and is solely for helping us make a better course and we need your help to do that.</p>

<form name="UDEMY-Feedback-WCAG21" method="POST" data-netlify="true" netlify-honeypot="bot-field">
<input class="actual-hidden" name="bot-field" tabindex="0">
<div class="contactForm-div">
	<label for="messageImprovements" class="contactForm-label">1. What improvements would you make to the course?</label>
	<textarea cols="5" id="messageImprovements" autocomplete="off" maxlength="5000" name="messageImprovements" rows="10" class="contactForm-control"></textarea>
</div>	
<div class="contactForm-div">
	<label for="messageWhatWorked" class="contactForm-label">2. What worked, what didn’t work, what could be done better?</label>
	<textarea cols="5" id="messageWhatWorked" autocomplete="off" maxlength="5000" name="messageWhatWorked" rows="10" class="contactForm-control"></textarea>
</div>	
<div>
	<input type="submit" value="Send Feedback" class="contactForm-button submit">
</div>
	
</form>
