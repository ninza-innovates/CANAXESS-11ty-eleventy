name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Eleventy build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Locked @11ty/eleventy 0.11.0 was verified with Node.js 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json has no build script. Its postbuild hook runs
      # _utils/copy.js, which is not in this repository, so an npm
      # script named build would fail after Eleventy succeeded.
      # The documented production build is `npx eleventy`.
      - name: Build site
        run: npx eleventy
